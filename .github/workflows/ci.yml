# 既存 CI（型検査とテスト）。pull_request で PR 側の YAML が動くため、信頼の根にはしない（受け入れるリスク Q57）。
#
# mutation ジョブ（harness/scripts/mutate.ts）：PR で変えた実装の行を少しずつ壊してテストを動かし、
# 壊してもテストが落ちなかった箇所を Summary に一覧で出す。限界：
# - 結果は PR 側のコードとこの YAML が決めるので、PR を出した側が偽れる。情報のためだけに出す。
# - 自動 Merge の条件や App の agent/* チェックの代わりにしない（条件にするなら、信頼できる実行が別に要る）。
# - Ruleset の必須チェック（context は ci）に足さない。ci ジョブとは別のジョブにする。
# - 全 PR で起動する（自動 Merge の経路に乗る PR だけに絞らない）。実装の .ts・.js を変えていない PR では
#   `mutate.ts --check-targets` だけが動き、npm ci と本体を省く（Summary に理由を出す）。
# - 壊す箇所の数（--max-mutants）と時間（--max-minutes）に上限を置く。上限で打ち切っても失敗にせず、打ち切った旨を出す。
#
# main への push では動かさない。Ruleset の必須チェックは strict（main に追いついていないと Merge できない）なので、
# Merge 後の main は PR の実行で試したマージコミットと同じ内容になる（harness/lib/ruleset.ts）。
name: ci

on:
  pull_request:

# 同じ PR に続けて push したら、古い head の実行を取り消す（必須チェックは head ごとなので、新しい head の ci が結果になる）
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  mutation:
    runs-on: ubuntu-latest
    # npm ci・ベースライン込みの 15 分・最後の1回のテスト（90 秒）が収まる長さ
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # マージコミットの第1親（base）と比べる
          fetch-depth: 2
      # npm ci を省く実行でキャッシュの保存が警告を出さないように、npm のキャッシュは使わない（依存は devDependencies の2つだけ）
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # 壊す候補（実装の .ts・.js の変更）が無ければ、npm ci と本体を省く。数えられなければ has-targets=true
      - id: targets
        run: node harness/scripts/mutate.ts --check-targets
      - if: steps.targets.outputs.has-targets == 'true'
        run: npm ci
      - if: steps.targets.outputs.has-targets == 'true'
        run: node harness/scripts/mutate.ts --max-mutants 30 --max-minutes 15 --test-timeout-seconds 90
