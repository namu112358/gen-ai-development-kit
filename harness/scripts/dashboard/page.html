<!doctype html>
<!-- エージェントの状態のグラフ（harness/scripts/dashboard.ts が配る）。外部を読み込まない1ファイル。外から入る文字は textContent で描く。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent グラフ</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #d7dce3; --col: #eef1f5;
    --active: #2563eb; --stale: #d97706; --waiting: #7c3aed; --blocked: #dc2626; --conflict: #db2777; --idle: #98a2b3;
    --e-depends: #dc2626; --e-epic: #7c3aed; --e-stacked: #d97706; --e-session: #2563eb;
    --run: #16a34a;
    --enf-code: #1f5fa8; --enf-cond: #a3620a; --enf-ai: #b3264e; --enf-human: #6a3fb0; --warn-bg: #fdecef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #181c24; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c3340; --col: #141820;
      --active: #60a5fa; --stale: #fbbf24; --waiting: #a78bfa; --blocked: #f87171; --conflict: #f472b6; --idle: #667085;
      --e-depends: #f87171; --e-epic: #a78bfa; --e-stacked: #fbbf24; --e-session: #60a5fa;
      --run: #4ade80;
      --enf-code: #6aa6ec; --enf-cond: #e0a84e; --enf-ai: #f07a9a; --enf-human: #b596ec; --warn-bg: #3a1a24;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .conn.ok i { background: var(--run); }
  #pollStatus { margin: 0; padding: 8px 16px; background: var(--warn-bg); color: var(--ink); border-bottom: 1px solid var(--line); }
  #pollStatus[hidden] { display: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); }
  .legend label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .legend svg { overflow: visible; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #wrap { position: relative; padding: 12px 16px 32px; overflow-x: auto; }
  #board { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 176px; gap: 10px; align-items: start; min-height: calc(100vh - 90px); }
  .col { background: var(--col); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 120px; }
  .col.side { background: transparent; }
  /* 列の上端の線で段階の強制のされ方を示す（色と線の形の両方） */
  .col.enf-code { border-top: 4px solid var(--enf-code); }
  .col.enf-cond { border-top: 3px solid var(--enf-cond); }
  .col.enf-ai { border-top: 3px dashed var(--enf-ai); }
  .col.enf-human { border-top: 5px double var(--enf-human); }
  .enf { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 999px; margin-left: 4px; white-space: nowrap; }
  .enf.code { color: var(--enf-code); border: 1px solid var(--enf-code); }
  .enf.cond { color: var(--enf-cond); border: 1px solid var(--enf-cond); }
  .enf.ai { color: var(--enf-ai); border: 1px dashed var(--enf-ai); }
  .enf.human { color: var(--enf-human); border: 1px solid var(--enf-human); }
  details.exit { font-size: 11px; color: var(--muted); margin: -4px 0 8px; }
  details.exit > summary { cursor: pointer; }
  details.exit p { margin: 4px 0 0; }
  details.exit b { color: var(--ink); font-weight: 600; }
  #todos { margin: 12px 16px 0; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--waiting); border-radius: 8px; padding: 8px 12px; }
  #todos h2 { font-size: 13px; margin: 0 0 4px; }
  #todos ul { margin: 0; padding-left: 1.2em; display: grid; gap: 2px; }
  #todos li a { color: var(--ink); font-weight: 600; text-decoration: none; }
  #todos li a:hover { text-decoration: underline; }
  #todos .reason { color: var(--muted); }
  #todos .none { color: var(--muted); margin: 0; }
  details.others { font-size: 12px; color: var(--muted); }
  details.others > summary { cursor: pointer; margin-bottom: 6px; }
  .warn { font-size: 11px; font-weight: 600; color: var(--enf-ai); background: var(--warn-bg); border-radius: 4px; padding: 1px 6px; margin-top: 4px; }
  .col h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .col.claimstage h2::before { content: "●"; color: var(--active); margin-right: 4px; font-size: 9px; }
  .card { position: relative; z-index: 1; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--idle); border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  .prrow { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 11px; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--line); }
  .prrow a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .prrow a:hover { text-decoration: underline; }
  details.sess { margin-top: 4px; font-size: 11px; }
  details.sess > summary { cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 5px; list-style: none; }
  details.sess > summary::-webkit-details-marker { display: none; }
  details.sess > summary::before { content: "▸"; font-size: 9px; }
  details.sess[open] > summary::before { content: "▾"; }
  details.sess .sub { padding-left: 10px; }
  .card[data-status="active"] { border-left-color: var(--active); }
  .card[data-status="stale"] { border-left-color: var(--stale); }
  .card[data-status="waiting-human"] { border-left-color: var(--waiting); }
  .card[data-status="blocked"] { border-left-color: var(--blocked); }
  .card[data-status="conflict"] { border-left-color: var(--conflict); }
  .card .num { font-weight: 650; color: var(--ink); text-decoration: none; }
  .card .num:hover { text-decoration: underline; }
  .card .title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .card .st { font-size: 11px; font-weight: 600; }
  .card .sub { font-size: 11px; margin-top: 3px; display: flex; gap: 4px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.run { background: var(--run); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }
  .session { border-left-color: var(--e-session); }
  .session .title { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #edges { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: visible; }
  #edges path { fill: none; stroke-width: 1.6; opacity: .75; }
  .empty { color: var(--muted); font-size: 12px; }
  @media (max-width: 600px) { #board { grid-auto-columns: 150px; } }
</style>
</head>
<body>
<header>
  <h1>Agent グラフ</h1>
  <span class="conn" id="conn"><i></i><span id="connText">接続中…</span></span>
  <span class="legend" id="statusLegend"></span>
  <span class="legend" id="enfLegend"></span>
  <span class="legend" id="edgeLegend"></span>
</header>
<p id="pollStatus" role="status" hidden></p>
<section id="todos" aria-label="人がすること"><h2 id="todosTitle">人がすること</h2><div id="todosBody"></div></section>
<div id="wrap">
  <div id="board"></div>
  <svg id="edges" aria-hidden="true"><defs id="defs"></defs></svg>
</div>
<script>
'use strict';
const SVG = 'http://www.w3.org/2000/svg';
const STATUS = {
  active: '着手中', stale: '停滞', 'waiting-human': '人待ち', blocked: '止まっている', conflict: '衝突', idle: '待機',
};
const STATUS_VAR = { active: '--active', stale: '--stale', 'waiting-human': '--waiting', blocked: '--blocked', conflict: '--conflict', idle: '--idle' };
const EDGES = {
  depends: { label: '依存', dash: '6 4' },
  epic: { label: 'Epic → 子', dash: '' },
  stacked: { label: 'Stacked PR', dash: '2 3' },
  session: { label: 'セッション', dash: '1 4' },
};
const ENFORCEMENT = { code: 'コードで必須', cond: '条件つき', ai: '手順だけ', human: '人' };
const CLAIM_COLS = new Set(['plan', 'plan-critique', 'plan-gate', 'implement', 'judge', 'fix', 'sync']);
const SIDE_COLS = new Set(['dependency', 'stopped']);

const STATUS_RANK = ['blocked', 'conflict', 'stale', 'active', 'waiting-human', 'idle'];

/**
 * タスクと辺から、画面のカードを組む（DOM に触れない純粋な関数）。
 * Issue を Closes する PR は Issue のカードに入れ、PR に着手宣言の段階があればその列に、状態は強いほうにする。
 * closes の辺は落とし、PR の端はカードに付け替え、自分への辺と重複を落とす。
 */
function buildCards(tasks, edges) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const owner = new Map();
  for (const e of edges) {
    const from = byId.get(e.from), to = byId.get(e.to);
    if (e.kind === 'closes' && from && from.kind === 'issue' && to && to.kind === 'pr') owner.set(e.to, e.from);
  }
  const cards = [];
  for (const t of tasks) {
    if (t.kind === 'pr' && owner.has(t.id)) continue;
    const prs = tasks.filter((p) => owner.get(p.id) === t.id).sort((a, b) => a.number - b.number);
    const claimed = prs.find((p) => p.claim && CLAIM_COLS.has(p.claim.stage) && p.column === p.claim.stage);
    const status = [t, ...prs].map((x) => x.status).sort((a, b) => STATUS_RANK.indexOf(a) - STATUS_RANK.indexOf(b))[0];
    const sessionIds = [];
    for (const x of [t, ...prs]) for (const s of x.sessions) if (!sessionIds.includes(s)) sessionIds.push(s);
    cards.push({
      id: t.id, kind: t.kind, number: t.number, title: t.title, url: t.url,
      column: claimed ? claimed.column : t.column, status, note: t.note, claim: t.claim,
      prs: prs.map((p) => ({ id: p.id, number: p.number, url: p.url, status: p.status, column: p.column, claim: p.claim, note: p.note })),
      sessions: sessionIds,
      warnings: t.warnings || [],
    });
  }
  const cardOf = (id) => owner.get(id) || id;
  const seen = new Set();
  const out = [];
  for (const e of edges) {
    if (e.kind === 'closes') continue;
    const from = cardOf(e.from), to = cardOf(e.to);
    const key = e.kind + ' ' + from + ' ' + to;
    if (from === to || seen.has(key)) continue;
    seen.add(key);
    out.push({ kind: e.kind, from, to });
  }
  return { cards, edges: out };
}

let columns = [];
const tasks = new Map();
const edgesByFrom = new Map();
let sessions = [];
const hidden = new Set();
/** 開いたセッションの折りたたみ（カードの id）。描き直しても開いたままにする */
const openSessions = new Set();
/** 開いた列の「終了条件」（列の id） */
const openExits = new Set();
let view = { cards: [], edges: [] };
let todos = [];
/** セッションの列の「ほか N 件」を開いているか */
let othersOpen = false;

/** セッションを、動いているもの（本体かサブエージェントが動いている）と、ほかに分ける（DOM に触れない） */
function splitSessions(list) {
  const isRunning = (s) => Boolean(s.running) || (s.subagents || []).some((a) => a.running);
  return { running: list.filter(isRunning), others: list.filter((s) => !isRunning(s)) };
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (s < 60) return s + '秒前';
  if (s < 3600) return Math.floor(s / 60) + '分前';
  if (s < 86400) return Math.floor(s / 3600) + '時間前';
  return Math.floor(s / 86400) + '日前';
}
/** 見張りの状態（SSE の status）を画面の上の帯の文に。読んでいるときは空 */
function statusText(s) {
  if (!s || (s.state !== 'paused' && s.state !== 'backoff')) return '';
  const at = new Date(s.until).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return s.state === 'paused'
    ? 'GitHub API の上限が近いため、' + at + ' まで読むのを止めています'
    : '読み込みに失敗したため、' + at + ' に読み直します';
}
function agoSpan(iso) {
  const s = el('span', 'ago', ago(iso));
  s.dataset.at = iso || '';
  return s;
}

function buildLegends() {
  const sl = document.getElementById('statusLegend');
  for (const [k, v] of Object.entries(STATUS)) {
    const l = el('label');
    const sw = el('span', 'swatch');
    sw.style.background = 'var(' + STATUS_VAR[k] + ')';
    l.append(sw, el('span', null, v));
    sl.append(l);
  }
  const en = document.getElementById('enfLegend');
  for (const [k, v] of Object.entries(ENFORCEMENT)) {
    const l = el('label');
    l.append(el('span', 'enf ' + k, v));
    l.title = { code: 'Ruleset の必須チェックか App のゲートが止める。飛ばせない', cond: 'ある状態のときだけ必須', ai: 'skill の文章だけ。飛ばしても止まらない', human: '人が決める' }[k];
    en.append(l);
  }
  const defs = document.getElementById('defs');
  const el2 = document.getElementById('edgeLegend');
  for (const [k, v] of Object.entries(EDGES)) {
    const m = document.createElementNS(SVG, 'marker');
    m.setAttribute('id', 'arrow-' + k);
    m.setAttribute('viewBox', '0 0 10 10');
    m.setAttribute('refX', '9'); m.setAttribute('refY', '5');
    m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7');
    m.setAttribute('orient', 'auto-start-reverse');
    const p = document.createElementNS(SVG, 'path');
    p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
    p.setAttribute('fill', 'var(--e-' + k + ')');
    m.append(p);
    defs.append(m);

    const l = el('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('change', () => { cb.checked ? hidden.delete(k) : hidden.add(k); drawEdges(); });
    const s = document.createElementNS(SVG, 'svg');
    s.setAttribute('width', '22'); s.setAttribute('height', '8');
    const ln = document.createElementNS(SVG, 'line');
    ln.setAttribute('x1', '0'); ln.setAttribute('y1', '4'); ln.setAttribute('x2', '22'); ln.setAttribute('y2', '4');
    ln.setAttribute('stroke', 'var(--e-' + k + ')'); ln.setAttribute('stroke-width', '2');
    if (v.dash) ln.setAttribute('stroke-dasharray', v.dash);
    s.append(ln);
    l.append(cb, s, el('span', null, v.label));
    el2.append(l);
  }
}

function claimText(claim) {
  return (claim.by === 'routine' ? 'Routine' : '手動') + (claim.stage ? '・' + claim.stage : '') + '・';
}

function sessionRows(c, ids) {
  const list = ids.map((sid) => sessions.find((x) => x.session === sid)).filter(Boolean);
  if (!list.length) return;
  const d = document.createElement('details');
  d.className = 'sess';
  d.open = openSessions.has(c.dataset.id);
  d.addEventListener('toggle', () => { d.open ? openSessions.add(c.dataset.id) : openSessions.delete(c.dataset.id); drawEdges(); });
  const running = list.some((s) => s.running || s.subagents.some((a) => a.running));
  const sum = document.createElement('summary');
  sum.append(el('span', 'dot' + (running ? ' run' : '')), el('span', null, list.length + ' セッション'));
  d.append(sum);
  for (const s of list) {
    const row = el('div', 'sub');
    row.append(el('span', 'dot' + (s.running ? ' run' : '')), el('span', null, s.short + (s.local ? '' : '（ほかの場所）')));
    if (s.lastAt) row.append(agoSpan(s.lastAt));
    d.append(row);
    const active = s.subagents.filter((a) => a.running);
    for (const a of (active.length ? active : s.subagents.slice(0, 1))) {
      const r = el('div', 'sub');
      r.style.paddingLeft = '20px';
      r.append(el('span', 'dot' + (a.running ? ' run' : '')), el('span', null, a.type), agoSpan(a.lastAt));
      r.title = a.description;
      d.append(r);
    }
  }
  c.append(d);
}

function taskCard(t) {
  const c = el('div', 'card');
  c.dataset.id = t.id;
  c.dataset.status = t.status;
  const head = el('div');
  const a = el('a', 'num', (t.kind === 'pr' ? 'PR #' : '#') + t.number);
  a.href = t.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
  const st = el('span', 'st', ' ' + STATUS[t.status]);
  st.style.color = 'var(' + STATUS_VAR[t.status] + ')';
  head.append(a, st);
  c.append(head, el('div', 'title', t.title));
  c.title = t.title + (t.note ? '\n' + t.note : '');
  if (t.claim) {
    const m = el('div', 'meta');
    m.append(el('span', null, claimText(t.claim)), agoSpan(t.claim.at));
    c.append(m);
  }
  if (t.note) c.append(el('div', 'meta', t.note));
  for (const w of t.warnings) c.append(el('div', 'warn', '⚠ ' + w));
  for (const p of t.prs) {
    const row = el('div', 'prrow');
    const link = el('a', null, 'PR #' + p.number);
    link.href = p.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    const ps = el('span', null, STATUS[p.status]);
    ps.style.color = 'var(' + STATUS_VAR[p.status] + ')';
    row.append(link, ps);
    if (p.claim) row.append(el('span', 'meta', claimText(p.claim)), agoSpan(p.claim.at));
    if (p.note) row.title = p.note;
    c.append(row);
  }
  sessionRows(c, t.sessions);
  return c;
}

function sessionCard(s) {
  const c = el('div', 'card session');
  c.dataset.id = s.id;
  const head = el('div', 'sub');
  head.append(el('span', 'dot' + (s.running ? ' run' : '')), el('span', 'title', s.short), agoSpan(s.lastAt));
  c.append(head);
  if (!s.local) c.append(el('div', 'meta', 'ほかの場所（claim のみ）'));
  for (const a of s.subagents.slice(0, 6)) {
    const r = el('div', 'sub');
    r.append(el('span', 'dot' + (a.running ? ' run' : '')), el('span', null, a.type), agoSpan(a.lastAt));
    r.title = a.description;
    c.append(r);
  }
  return c;
}

function renderTodos() {
  document.getElementById('todosTitle').textContent = '人がすること（' + todos.length + '）';
  const body = document.getElementById('todosBody');
  body.replaceChildren();
  if (!todos.length) { body.append(el('p', 'none', 'いま人がすることはありません')); return; }
  const ul = el('ul');
  for (const t of todos) {
    const li = el('li');
    const a = el('a', null, (t.kind === 'pr' ? 'PR #' : '#') + t.number + ' ' + t.title);
    a.href = t.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    li.append(a, el('span', 'reason', ' — ' + t.reason));
    ul.append(li);
  }
  body.append(ul);
}

function render() {
  renderTodos();
  const board = document.getElementById('board');
  board.replaceChildren();
  view = buildCards([...tasks.values()], [...edgesByFrom.values()].flat());
  const byCol = new Map(columns.map((c) => [c.id, []]));
  for (const card of view.cards) (byCol.get(card.column) || []).push(card);
  for (const col of columns) {
    const box = el('section', 'col enf-' + col.enforcement + (SIDE_COLS.has(col.id) ? ' side' : '') + (CLAIM_COLS.has(col.id) ? ' claimstage' : ''));
    const items = (byCol.get(col.id) || []).sort((a, b) => a.number - b.number);
    const h = el('h2');
    const name = el('span', null, col.label);
    name.append(el('span', 'enf ' + col.enforcement, ENFORCEMENT[col.enforcement]));
    h.append(name, el('span', null, items.length || ''));
    box.append(h);
    const ex = document.createElement('details');
    ex.className = 'exit';
    ex.open = openExits.has(col.id);
    ex.addEventListener('toggle', () => { ex.open ? openExits.add(col.id) : openExits.delete(col.id); drawEdges(); });
    const sum = document.createElement('summary');
    sum.textContent = '終了条件';
    const p1 = el('p'); p1.append(el('b', null, '終了条件：'), document.createTextNode(col.exit));
    const p2 = el('p'); p2.append(el('b', null, '止めるもの：'), document.createTextNode(col.stopper));
    ex.append(sum, p1, p2);
    box.append(ex);
    for (const card of items) box.append(taskCard(card));
    if (!items.length) box.append(el('div', 'empty', '—'));
    board.append(box);
  }
  const sbox = el('section', 'col side');
  const h = el('h2');
  h.append(el('span', null, 'セッション'), el('span', null, sessions.length || ''));
  sbox.append(h);
  const split = splitSessions(sessions);
  for (const s of split.running) sbox.append(sessionCard(s));
  if (!split.running.length) sbox.append(el('div', 'empty', '動いているセッションはありません'));
  if (split.others.length) {
    const d = document.createElement('details');
    d.className = 'others';
    d.open = othersOpen;
    d.addEventListener('toggle', () => { othersOpen = d.open; drawEdges(); });
    const sum = document.createElement('summary');
    sum.textContent = 'ほか ' + split.others.length + ' 件';
    d.append(sum);
    for (const s of split.others) d.append(sessionCard(s));
    sbox.append(d);
  }
  board.append(sbox);
  drawEdges();
}

function drawEdges() {
  const svg = document.getElementById('edges');
  const wrap = document.getElementById('wrap');
  for (const p of [...svg.querySelectorAll('path.edge')]) p.remove();
  const base = wrap.getBoundingClientRect();
  svg.setAttribute('width', String(wrap.scrollWidth));
  svg.setAttribute('height', String(wrap.scrollHeight));
  const box = (id) => {
    const n = wrap.querySelector('[data-id="' + CSS.escape(id) + '"]');
    if (!n) return null;
    const r = n.getBoundingClientRect();
    return { x: r.left - base.left + wrap.scrollLeft, y: r.top - base.top + wrap.scrollTop, w: r.width, h: r.height };
  };
  for (const e of view.edges) {
    if (hidden.has(e.kind)) continue;
    const a = box(e.from), b = box(e.to);
    if (!a || !b) continue;
    let x1, y1, x2, y2, d;
    if (Math.abs(a.x - b.x) < 4) {
      // 同じ列：左側を回る
      x1 = a.x; y1 = a.y + a.h / 2; x2 = b.x; y2 = b.y + b.h / 2;
      const bend = Math.min(40, 10 + Math.abs(y2 - y1) / 6);
      d = 'M' + x1 + ',' + y1 + ' C' + (x1 - bend) + ',' + y1 + ' ' + (x2 - bend) + ',' + y2 + ' ' + x2 + ',' + y2;
    } else {
      const right = b.x > a.x;
      x1 = right ? a.x + a.w : a.x; y1 = a.y + a.h / 2;
      x2 = right ? b.x : b.x + b.w; y2 = b.y + b.h / 2;
      const dx = Math.max(30, Math.abs(x2 - x1) / 2) * (right ? 1 : -1);
      d = 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2;
    }
    const p = document.createElementNS(SVG, 'path');
    p.setAttribute('class', 'edge');
    p.setAttribute('d', d);
    p.setAttribute('stroke', 'var(--e-' + e.kind + ')');
    if (EDGES[e.kind].dash) p.setAttribute('stroke-dasharray', EDGES[e.kind].dash);
    p.setAttribute('marker-end', 'url(#arrow-' + e.kind + ')');
    svg.append(p);
  }
}

let pending = false;
function schedule() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; render(); });
}

function applySnapshot(g) {
  columns = g.columns;
  tasks.clear(); edgesByFrom.clear();
  for (const t of g.tasks) tasks.set(t.id, t);
  for (const e of g.edges) { if (!edgesByFrom.has(e.from)) edgesByFrom.set(e.from, []); edgesByFrom.get(e.from).push(e); }
  sessions = g.sessions;
  todos = g.todos || [];
  schedule();
}

function connect() {
  const conn = document.getElementById('conn');
  const text = document.getElementById('connText');
  const es = new EventSource('/events');
  es.addEventListener('open', () => { conn.classList.add('ok'); text.textContent = '接続中（リアルタイム）'; });
  es.addEventListener('error', () => { conn.classList.remove('ok'); text.textContent = '再接続を待っています…'; });
  es.addEventListener('snapshot', (m) => applySnapshot(JSON.parse(m.data)));
  es.addEventListener('task', (m) => {
    const e = JSON.parse(m.data);
    tasks.set(e.task.id, e.task);
    edgesByFrom.set(e.task.id, e.edges);
    schedule();
  });
  es.addEventListener('remove', (m) => {
    const e = JSON.parse(m.data);
    tasks.delete(e.id); edgesByFrom.delete(e.id);
    schedule();
  });
  es.addEventListener('sessions', (m) => { sessions = JSON.parse(m.data).sessions; schedule(); });
  es.addEventListener('todos', (m) => { todos = JSON.parse(m.data).todos; schedule(); });
  es.addEventListener('status', (m) => {
    const bar = document.getElementById('pollStatus');
    const t = statusText(JSON.parse(m.data));
    bar.textContent = t;
    bar.hidden = t === '';
  });
}

// テスト（node:vm で buildCards だけを読む）では DOM が無いので起動しない
if (typeof document !== 'undefined') {
  buildLegends();
  connect();
  setInterval(() => { for (const s of document.querySelectorAll('.ago')) s.textContent = ago(s.dataset.at); }, 1000);
  window.addEventListener('resize', drawEdges);
  document.getElementById('wrap').addEventListener('scroll', drawEdges);
}
